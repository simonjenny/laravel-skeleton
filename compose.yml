services:
  web:
    container_name: yournamehere
    build: https://${GITHUB_USERNAME}:${GITHUB_AUTH_TOKEN}@github.com
    ports:
      - 127.0.0.1:80:80
    user: "1000:1000"
    restart: unless-stopped
    volumes:
      - './logfiles:/app/storage/logs'
    env_file:
      - .env
    healthcheck:
      test: "curl --silent --fail http://localhost/up > /dev/null || exit 1"
      interval: 60s
      retries: 2
      start_period: 60s