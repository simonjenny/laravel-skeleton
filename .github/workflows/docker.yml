name: Docker Image CI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:

  build:
    # Only runs if ENABLE_DOCKER_BUILD variable is set to 'true' in the repository settings
    # (Settings → Secrets and variables → Actions → Variables)
    if: vars.ENABLE_DOCKER_BUILD == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.TOKEN }}
    - name: Set up release tag
      id: vars
      run: |
        if [ -z "${{ github.event.release.tag_name }}" ]; then
          echo "::error::Release-Tag nicht gefunden."
          exit 1
        fi
        echo "RELEASE_TAG=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
    - name: Build Docker image (Release-Tag)
      run: |
        IMAGE_NAME=ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
        docker build . --file Dockerfile --tag $IMAGE_NAME
        docker tag $IMAGE_NAME ghcr.io/${{ github.repository }}:latest
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
          image-ref: 'ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
    - name: Push Docker images to GHCR
      run: |
        docker push ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
        docker push ghcr.io/${{ github.repository }}:latest
